# Prompt Forecast — ghost-text prediction of the user's next prompt in the
# resident Web composer. Every key below is optional; the row's `config` block
# overrides the defaults in index.js. Uncomment and edit a value to tune it:
#
#   enabled: true          # false leaves the Host half unregistered
#   maxTokens: 256         # output budget of the prediction request
#   temperature: 0.4
#   timeoutMs: 2000        # hard bound on the prediction request, in milliseconds
#   maxPromptChars: 80     # clip length of the predicted prompt
#   maxInputChars: 6000    # size bound of the conversation excerpt
#   skipSubagents: true    # subagent sessions get no prediction
#   provider: ...          # explicit route; defaults to the turn's own model
#   model: ...
- insert:
    - id: prompt-forecast
      name: '@local/dsh-prompt-forecast'
